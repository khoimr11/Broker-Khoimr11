name: Cập nhật dữ liệu chứng khoán

on:
  schedule:
    - cron: '40 8 * * 1-5'   # 15:40 giờ Việt Nam, thứ 2–6
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ['scripts/update.mjs', 'scripts/fund.mjs', 'scripts/engine.cjs', '.github/workflows/update.yml']

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tải và phân tích toàn bộ mã HOSE, HNX, UPCoM (giá + báo cáo tài chính)
        run: node --max-old-space-size=6000 scripts/update.mjs
      - name: Đẩy dữ liệu sang nhánh data (ghi đè, không giữ lịch sử để repo nhẹ)
        run: |
          cd data
          git init -q -b data
          git config user.name "xanhtim-bot"
          git config user.email "xanhtim-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Dữ liệu ngày $(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data:data
