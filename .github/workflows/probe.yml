name: Thử nguồn dữ liệu
on:
  push:
    branches: [main]
    paths: ['scripts/probe.mjs']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe.mjs
      - run: |
          git config user.name "xanhtim-bot"; git config user.email "xanhtim-bot@users.noreply.github.com"
          git add data/probe; git commit -m "probe" || exit 0; git pull --rebase origin main; git push
