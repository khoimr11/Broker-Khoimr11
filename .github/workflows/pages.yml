name: Cập nhật giao diện web

# Khi chỉ sửa giao diện (app/index.html): dựng lại trang với dữ liệu sẵn có ở nhánh data, không tính lại
on:
  push:
    branches: [main]
    paths: ['app/**', 'scripts/site.sh', '.github/workflows/pages.yml']
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Lấy dữ liệu mới nhất từ nhánh data
        run: git clone -q --depth 1 --branch data "https://github.com/${{ github.repository }}.git" datasrc
      - name: Dựng trang web
        run: bash scripts/site.sh datasrc
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Đưa lên GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
