name: Giữ lịch chạy luôn bật

# GitHub tự tắt lịch chạy định kỳ của repo công khai nếu 60 ngày không có commit.
# Mỗi tháng ghi một dòng vào keepalive.txt trên nhánh main để lịch cập nhật dữ liệu chạy mãi.
on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > keepalive.txt
          git config user.name "xanhtim-bot"; git config user.email "xanhtim-bot@users.noreply.github.com"
          git add keepalive.txt && git commit -qm "Giữ lịch chạy: $(date -u +%Y-%m)" && git push || echo "Không có thay đổi"
